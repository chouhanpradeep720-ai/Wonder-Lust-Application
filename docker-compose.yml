version: "3.8"

services:
  backend:
    container_name: backend
    build: ./backend
    env_file:
      - ./backend/.env.docker
    ports:
      - "31100:8080"
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    container_name: frontend
    build: ./frontend
    env_file:
      - ./frontend/.env.docker
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    container_name: redis-service
    image: redis:7.0.5-alpine
    expose:
      - "6379"
    restart: unless-stopped
